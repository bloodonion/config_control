---



- name: Replace line in file
  hosts: all
  become: true
  tasks:
    - name: pulling origional file
      fetch:
        src: "/etc/default/test_file"
        dest: "local_backup/{{ inventory_hostname }}-configfile"
        flat: no
        

    - name: editing line in defaults
      replace:
        path: /etc/default/test_file
        regexp: '^{{ line_3_content | regex_escape() }}$'
        replace: "{{ edit1 }}"
        backup: true    # /tmp/testfile.txt

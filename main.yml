---
- name: Replace line in file
  hosts: all
  become: true
  tasks:
    # - name: pulling origional file
    #   ansible.builtin.fetch:
    #     src: "/etc/default/test_file"
    #     dest: "local_backup/{{ inventory_hostname }}-configfile"
    #     flat: no

    - name: Checking local backed up config file.
      ansible.builtin.stat:
        path: "local_backup/{{ inventory_hostname }}-configfile"
      delegate_to: localhost
      register: backup_stat

    - name: Backing up config file.
      ansible.builtin.fetch:
        src: /etc/default/test_file
        dest: "local_backup/{{ inventory_hostname }}-configfile"
        flat: no
        validate_checksum: true
      when: backup_stat.stat.exists == false

    - name: editing line in default
      ansible.builtin.replace:
        path: /etc/default/test_file
        regexp: '\A((?:[^\r\n]*\r?\n){2})[^\r\n]*(\r?\n|$)' # < where there is 2 change to the line before you want to change
        replace: '\1{{ edit1 }}\2'

    - name: dropping template
      ansible.builtin.template:
        src: templates/solr_config.j2
        dest: /etc/default/test_template
        owner: root
        group: root
        mode: '0644'
